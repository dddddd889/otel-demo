receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/add-local-time:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Trace 使用 Span 开始时间生成东八区展示字段
          - set(
              attributes["timestamp_zh_cn"],
              FormatTime(
                start_time + Duration("8h"),
                "%Y年%m月%d日 %H:%M:%S +08:00"
              )
            )
    log_statements:
      - context: log
        statements:
          # 保留原始时间，新增东八区中文展示字段
          - set(
              attributes["timestamp_zh_cn"],
              FormatTime(
                time + Duration("8h"),
                "%Y年%m月%d日 %H:%M:%S +08:00"
              )
            )
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: deployment.environment.name
        value: local-demo
        action: upsert
  tail_sampling:
    # 等待慢请求完成后再决策，否则可能在 1.2 秒延迟 Span 结束前提前采样。
    # 多个 Node.js 进程各自批量导出；等待足够久，避免异步 Consumer Span 到达前提前决策。
    decision_wait: 8s
    policies:
      - name: drop-health-traces
        type: drop
        drop:
          drop_sub_policy:
            - name: health-route
              type: string_attribute
              string_attribute:
                key: http.route
                values: [/health]
      - name: keep-error-traces
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-normal-traces
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel_demo
    enable_open_metrics: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, resource, transform/add-local-time, batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      # Metric 原生带时间戳；不增加动态时间属性，避免生成高基数标签。
      processors: [memory_limiter, resource, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/add-local-time, batch]
      exporters: [debug, otlphttp/loki]
