groups:
  - name: checkout-demo
    rules:
      - alert: CheckoutFailuresDetected
        expr: increase(checkout_request_duration_seconds_count{http_response_status_code="500"}[1m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 最近一分钟出现结账失败
          description: checkout-service 在最近一分钟记录到失败请求。

      - alert: CheckoutP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(checkout_request_duration_seconds_bucket[5m])
            )
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 结账请求 P95 延迟过高
          description: checkout-service 的五分钟 P95 延迟持续超过 500ms。
